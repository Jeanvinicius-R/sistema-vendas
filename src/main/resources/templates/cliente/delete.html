<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Excluir cliente')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('clientes')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Excluir cliente</h1>
            <p class="subtitle">Esta ação não pode ser desfeita.</p>
        </div>
    </div>

    <div class="card card-danger form-card">
        <div class="card-header">
            Tem certeza que deseja excluir <strong th:text="${cliente.nomeCompleto}"></strong>?
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-4 text-secondary fw-semibold">Nome</dt>
                <dd class="col-sm-8" th:text="${cliente.nomeCompleto}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">E-mail</dt>
                <dd class="col-sm-8" th:text="${cliente.email}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">CPF</dt>
                <dd class="col-sm-8" th:text="${cliente.cpf}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">Telefone</dt>
                <dd class="col-sm-8" th:text="${cliente.telefone}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">Endereço</dt>
                <dd class="col-sm-8 mb-0"
                    th:text="${cliente.endereco.logradouro} + ', ' + ${cliente.endereco.numero} + ' - ' + ${cliente.endereco.bairro} + ' - ' + ${cliente.endereco.cidade} + '/' + ${cliente.endereco.uf} + ' - ' + ${cliente.endereco.cep}"></dd>
            </dl>

            <form th:action="@{/clientes/delete/{id}(id=${cliente.id})}" method="post" class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
                <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
