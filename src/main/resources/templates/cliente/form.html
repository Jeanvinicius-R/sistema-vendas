<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${cliente.id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('clientes')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1 th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Novo cliente</h1>
            <p class="subtitle">Preencha os dados pessoais e o endereço.</p>
        </div>
    </div>

    <form th:action="@{${cliente.id == null} ? '/clientes/novo' : '/clientes/edit/' + ${cliente.id}}"
          th:object="${cliente}" method="post" novalidate>

        <!-- Dados pessoais -->
        <div class="card form-card mb-4">
            <div class="card-body">
                <p class="form-section-title">Dados pessoais</p>

                <div class="mb-3">
                    <label for="nomeCompleto" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" th:field="*{nomeCompleto}"
                           th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" th:field="*{cpf}"
                               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                               placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="off">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" th:field="*{telefone}"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                               placeholder="(00) 00000-0000">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Endereço -->
        <div class="card form-card mb-4">
            <div class="card-body">
                <p class="form-section-title">Endereço</p>

                <div class="mb-3">
                    <label for="logradouro" class="form-label">Logradouro</label>
                    <input type="text" class="form-control" id="logradouro" th:field="*{endereco.logradouro}"
                           th:classappend="${#fields.hasErrors('endereco.logradouro')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.logradouro')}" th:errors="*{endereco.logradouro}"></div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="numero" class="form-label">Número <small class="text-muted fw-normal">(opcional)</small></label>
                        <input type="text" class="form-control" id="numero" th:field="*{endereco.numero}"
                               th:classappend="${#fields.hasErrors('endereco.numero')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.numero')}" th:errors="*{endereco.numero}"></div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="complemento" class="form-label">Complemento <small class="text-muted fw-normal">(opcional)</small></label>
                        <input type="text" class="form-control" id="complemento" th:field="*{endereco.complemento}"
                               th:classappend="${#fields.hasErrors('endereco.complemento')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.complemento')}" th:errors="*{endereco.complemento}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro" th:field="*{endereco.bairro}"
                           th:classappend="${#fields.hasErrors('endereco.bairro')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.bairro')}" th:errors="*{endereco.bairro}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" th:field="*{endereco.cidade}"
                               th:classappend="${#fields.hasErrors('endereco.cidade')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.cidade')}" th:errors="*{endereco.cidade}"></div>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="uf" class="form-label">UF</label>
                        <input type="text" class="form-control" id="uf" th:field="*{endereco.uf}"
                               th:classappend="${#fields.hasErrors('endereco.uf')} ? 'is-invalid'"
                               maxlength="2">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.uf')}" th:errors="*{endereco.uf}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="cep" th:field="*{endereco.cep}"
                               th:classappend="${#fields.hasErrors('endereco.cep')} ? 'is-invalid'"
                               placeholder="00000-000">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco.cep')}" th:errors="*{endereco.cep}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-4">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    // Máscara do CPF: aceita só dígitos (máx. 11) e formata como 000.000.000-00
    const campoCpf = document.getElementById('cpf');

    function formatarCpf(valor) {
        const d = valor.replace(/\D/g, '').slice(0, 11);
        return d
            .replace(/^(\d{3})(\d)/, '$1.$2')
            .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
            .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
    }

    campoCpf.addEventListener('input', () => {
        campoCpf.value = formatarCpf(campoCpf.value);
    });
    campoCpf.value = formatarCpf(campoCpf.value);
</script>
</body>
</html>
