<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar Pedido</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            Pedido #
            <span th:text="${pedido.id}"></span>
        </h1>

        <a th:href="@{/pedidos}"
           class="btn btn-secondary">
            Voltar
        </a>
    </div>

    <!-- Mensagens -->

    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>


    <!-- Informações do pedido -->

    <div class="card mb-4">

        <div class="card-header">
            <strong>Informações do Pedido</strong>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4">
                    <strong>Cliente:</strong>

                    <span th:text="${pedido.cliente.nomeCompleto}">
                    </span>
                </div>

                <div class="col-md-4">
                    <strong>Data:</strong>

                    <span th:text="${pedido.dataPedidoFormatada}">
                    </span>
                </div>

                <div class="col-md-4">
                    <strong>Status:</strong>

                    <span
                        class="badge"
                        th:classappend="${pedido.status.name() == 'ATIVO'} ? ' bg-success' : ' bg-danger'"
                        th:text="${pedido.status}">
                    </span>
                </div>

            </div>

            <hr>

            <div class="row">

                <div class="col-md-6">

                    <strong>
                        Valor Total:
                    </strong>

                    <span
                        class="fs-4 text-success"
                        th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 2, 2)}">
                    </span>

                </div>

                <div class="col-md-6">

                    <strong>Version:</strong>

                    <span th:text="${pedido.version}">
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Adicionar produto -->

    <div class="card mb-4">

        <div class="card-header">
            <strong>Adicionar Produto</strong>
        </div>

        <div class="card-body">

            <form
                th:action="@{'/pedidos/' + ${pedido.id} + '/adicionar-item'}"
                method="post">

                <div class="row align-items-end">

                    <div class="col-md-6">

                        <label class="form-label">
                            Produto
                        </label>

                        <select
                            name="produtoId"
                            class="form-select"
                            required>

                            <option value="">
                                Selecione um produto
                            </option>

                            <option
                                th:each="produto : ${produtos}"
                                th:value="${produto.id}"
                                th:text="${produto.nome + ' - R$ ' + #numbers.formatDecimal(produto.preco, 2, 2) + ' | Estoque: ' + produto.quantidadeEmEstoque}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            name="quantidade"
                            class="form-control"
                            min="1"
                            value="1"
                            required>

                    </div>

                    <div class="col-md-3">

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Adicionar

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- Itens do pedido -->

    <div class="card mb-4">

        <div class="card-header">
            <strong>Itens do Pedido</strong>
        </div>

        <div class="card-body p-0">

            <div
                th:if="${pedido.itens.empty}"
                class="alert alert-warning m-3">

                Nenhum produto foi adicionado ao pedido.

            </div>

            <div
                th:unless="${pedido.itens.empty}"
                class="table-responsive">

                <table class="table table-striped table-hover mb-0">

                    <thead>

                    <tr>

                        <th>Produto</th>

                        <th>Preço Unitário</th>

                        <th>Quantidade</th>

                        <th>Subtotal</th>

                        <th>Ações</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr
                        th:each="item : ${pedido.itens}">

                        <td
                            th:text="${item.produto.nome}">
                        </td>

                        <td
                            th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 2, 2)}">
                        </td>

                        <td>

                            <form
                                th:action="@{'/pedidos/' + ${pedido.id} + '/alterar-item/' + ${item.id}}"
                                method="post"
                                class="d-flex gap-2">

                                <input
                                    type="number"
                                    name="quantidade"
                                    min="1"
                                    th:value="${item.quantidade}"
                                    class="form-control"
                                    style="width: 90px"
                                    required>

                                <button
                                    type="submit"
                                    class="btn btn-sm btn-warning">

                                    Alterar

                                </button>

                            </form>

                        </td>

                        <td
                            th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario.multiply(T(java.math.BigDecimal).valueOf(item.quantidade)), 2, 2)}">
                        </td>

                        <td>

                            <form
                                th:action="@{'/pedidos/' + ${pedido.id} + '/remover-item/' + ${item.id}}"
                                method="post">

                                <button
                                    type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Deseja remover este produto do pedido?');">

                                    Remover

                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Ações -->

    <div class="d-flex justify-content-between">

        <a
            th:href="@{'/pedidos/detalhes/' + ${pedido.id}}"
            class="btn btn-info text-white">

            Ver detalhes

        </a>

        <div>

            <a
                th:href="@{'/pedidos/cancelar/' + ${pedido.id}}"
                class="btn btn-danger">

                Cancelar Pedido

            </a>

            <form
                th:action="@{'/pedidos/' + ${pedido.id} + '/finalizar'}"
                method="post"
                class="d-inline">

                <button
                    type="submit"
                    class="btn btn-success">

                    Finalizar Pedido

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
