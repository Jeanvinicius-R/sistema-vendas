<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cancelar pedido')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('pedidos')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Cancelar pedido</h1>
            <p class="subtitle">Confirme o cancelamento abaixo.</p>
        </div>
    </div>

    <div class="card card-danger form-card">
        <div class="card-header">
            Cancelar o pedido <strong th:text="'#' + ${pedido.id}">#1</strong>
            do cliente <strong th:text="${pedido.cliente.nomeCompleto}"></strong>?
        </div>

        <div class="card-body">
            <p class="text-secondary">
                Os produtos deste pedido serão devolvidos ao estoque.
                O registro não será excluído.
            </p>

            <div class="table-responsive mb-3">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th class="text-end">Quantidade</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${pedido.itens}">
                        <td th:text="${item.produto.nome}">Produto</td>
                        <td class="text-end" th:text="${item.quantidade}">1</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p class="mb-4">
                <span class="stat-label">Valor total</span><br>
                <span class="stat-value money"
                      th:text="${#numbers.formatCurrency(pedido.valorTotal)}">R$ 0,00</span>
            </p>

            <form th:action="@{/pedidos/cancelar/{id}(id=${pedido.id})}" method="post" class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Confirmar cancelamento</button>
                <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar</a>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
