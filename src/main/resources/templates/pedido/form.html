<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo pedido')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('pedidos')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Novo pedido</h1>
            <p class="subtitle">Escolha o cliente. Os produtos são adicionados na próxima etapa.</p>
        </div>
    </div>

    <!-- Mensagem de erro -->
    <div th:if="${erro}" class="alert alert-danger form-card" th:text="${erro}"></div>

    <div class="card form-card">
        <div class="card-body">

            <!-- Caso existam clientes -->
            <form th:if="${clientes != null and !#lists.isEmpty(clientes)}"
                  th:action="@{/pedidos/novo}" method="post">

                <div class="mb-4">
                    <label for="clienteId" class="form-label">Cliente</label>
                    <select id="clienteId" name="clienteId" class="form-select form-select-lg" required>
                        <option value="">Selecione um cliente</option>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nomeCompleto}">Cliente</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Criar pedido</button>
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>

            <!-- Caso não existam clientes -->
            <div th:if="${clientes == null or #lists.isEmpty(clientes)}">
                <div class="alert alert-warning">
                    <strong>Nenhum cliente cadastrado.</strong><br>
                    Para criar um pedido, primeiro é necessário cadastrar pelo menos um cliente.
                </div>
                <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar para pedidos</a>
            </div>

        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
