<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Pedido - Sistema de Vendas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: white;
        }

        select:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #0d6efd;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5c636a;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #f8d7da;
            color: #842029;
        }

        .sem-clientes {
            padding: 15px;
            border-radius: 6px;
            background-color: #fff3cd;
            color: #664d03;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Novo Pedido</h1>

        <!-- Mensagem de erro -->
        <div th:if="${erro}"
             class="alert"
             th:text="${erro}">
        </div>

        <!-- Caso existam clientes -->
        <form th:if="${clientes != null and !#lists.isEmpty(clientes)}"
              th:action="@{/pedidos/novo}"
              method="post">

            <div class="form-group">

                <label for="clienteId">
                    Cliente
                </label>

                <select id="clienteId"
                        name="clienteId"
                        required>

                    <option value="">
                        -- Selecione um cliente --
                    </option>

                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.id}"
                            th:text="${cliente.nomeCompleto}">
                        Cliente
                    </option>

                </select>

            </div>

            <div class="acoes">

                <a th:href="@{/pedidos}"
                   class="btn btn-secondary">
                    Voltar
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Criar Pedido
                </button>

            </div>

        </form>

        <!-- Caso não existam clientes -->
        <div th:if="${clientes == null or #lists.isEmpty(clientes)}"
             class="sem-clientes">

            <strong>Nenhum cliente cadastrado.</strong>

            <p>
                Para criar um pedido, primeiro é necessário
                cadastrar pelo menos um cliente.
            </p>

            <a th:href="@{/pedidos}"
               class="btn btn-secondary">
                Voltar para pedidos
            </a>

        </div>

    </div>

</div>

</body>
</html>
