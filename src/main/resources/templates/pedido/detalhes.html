<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Pedido</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>
            Detalhes do Pedido #
            <span th:text="${pedido.id}"></span>
        </h1>

        <a
            th:href="@{/pedidos}"
            class="btn btn-secondary">

            Voltar

        </a>

    </div>


    <!-- Informações -->

    <div class="card mb-4">

        <div class="card-header">

            <strong>
                Informações do Pedido
            </strong>

        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-6">

                    <strong>
                        Cliente:
                    </strong>

                    <span
                        th:text="${pedido.cliente.nomeCompleto}">
                    </span>

                </div>

                <div class="col-md-6">

                    <strong>
                        E-mail:
                    </strong>

                    <span
                        th:text="${pedido.cliente.email}">
                    </span>

                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">

                    <strong>
                        Data:
                    </strong>

                    <span
                        th:text="${pedido.dataPedidoFormatada}">
                    </span>

                </div>

                <div class="col-md-4">

                    <strong>
                        Status:
                    </strong>

                    <span
                        class="badge"
                        th:classappend="${pedido.status.name() == 'ATIVO'} ? ' bg-success' : ' bg-danger'"
                        th:text="${pedido.status}">
                    </span>

                </div>

                <div class="col-md-4">

                    <strong>
                        Version:
                    </strong>

                    <span
                        th:text="${pedido.version}">
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Produtos -->

    <div class="card mb-4">

        <div class="card-header">

            <strong>
                Produtos do Pedido
            </strong>

        </div>

        <div class="card-body p-0">

            <div
                th:if="${pedido.itens.empty}"
                class="alert alert-warning m-3">

                Este pedido não possui produtos.

            </div>


            <div
                th:unless="${pedido.itens.empty}"
                class="table-responsive">

                <table
                    class="table table-striped table-hover mb-0">

                    <thead>

                    <tr>

                        <th>
                            Produto
                        </th>

                        <th>
                            Preço Unitário
                        </th>

                        <th>
                            Quantidade
                        </th>

                        <th>
                            Subtotal
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr
                        th:each="item : ${pedido.itens}">

                        <td
                            th:text="${item.produto.nome}">
                        </td>

                        <td
                            th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 2, 2)}">
                        </td>

                        <td
                            th:text="${item.quantidade}">
                        </td>

                        <td
                            th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario.multiply(T(java.math.BigDecimal).valueOf(item.quantidade)), 2, 2)}">
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Total -->

    <div class="card mb-4">

        <div class="card-body">

            <div
                class="d-flex justify-content-end">

                <h3>

                    Total:

                    <span
                        class="text-success"
                        th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 2, 2)}">
                    </span>

                </h3>

            </div>

        </div>

    </div>


    <!-- Ações -->

    <div
        class="d-flex justify-content-between">

        <a
            th:href="@{'/pedidos/edit/' + ${pedido.id}}"
            class="btn btn-primary"
            th:if="${pedido.status.name() == 'ATIVO'}">

            Editar Pedido

        </a>


        <a
            th:href="@{'/pedidos/cancelar/' + ${pedido.id}}"
            class="btn btn-danger"
            th:if="${pedido.status.name() == 'ATIVO'}">

            Cancelar Pedido

        </a>

    </div>

</div>

</body>

</html>
