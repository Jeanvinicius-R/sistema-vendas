<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('pedidos')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Pedidos</h1>
            <p class="subtitle">Acompanhe e gerencie as vendas.</p>
        </div>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">+ Novo pedido</a>
    </div>

    <!-- Mensagens -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card">

        <!-- Quando não existem pedidos -->
        <div th:if="${#lists.isEmpty(pedidos)}" class="empty-state">
            <h2>Nenhum pedido encontrado</h2>
            <p>Ainda não existem pedidos cadastrados.</p>
            <a th:href="@{/pedidos/novo}" class="btn btn-primary">Criar primeiro pedido</a>
        </div>

        <!-- Quando existem pedidos -->
        <div th:unless="${#lists.isEmpty(pedidos)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nº</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Valor total</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td class="fw-semibold" th:text="'#' + ${pedido.id}">#1</td>

                    <td th:text="${pedido.cliente.nomeCompleto}">Cliente</td>

                    <td class="text-secondary text-nowrap" th:text="${pedido.dataPedidoFormatada}">20/09/2026</td>

                    <td class="money fw-semibold"
                        th:text="${#numbers.formatCurrency(pedido.valorTotal)}">R$ 0,00</td>

                    <td>
                        <span th:if="${pedido.status.name() == 'ATIVO'}"
                              class="badge rounded-pill bg-success-subtle text-success-emphasis">ATIVO</span>
                        <span th:if="${pedido.status.name() == 'CANCELADO'}"
                              class="badge rounded-pill bg-danger-subtle text-danger-emphasis">CANCELADO</span>
                    </td>

                    <td class="text-end text-nowrap">
                        <a th:href="@{/pedidos/detalhes/{id}(id=${pedido.id})}"
                           class="btn btn-sm btn-outline-secondary">Detalhes</a>

                        <a th:if="${pedido.status.name() == 'ATIVO'}"
                           th:href="@{/pedidos/edit/{id}(id=${pedido.id})}"
                           class="btn btn-sm btn-outline-primary">Editar</a>

                        <a th:if="${pedido.status.name() == 'ATIVO'}"
                           th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}"
                           class="btn btn-sm btn-outline-danger">Cancelar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
