<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Menu compartilhado. "ativo" destaca o item da página atual -->
<nav th:fragment="menu(ativo)" class="navbar navbar-expand-md navbar-dark sv-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/pedidos}">
            <img class="brand-logo" th:src="@{/img/logo.svg}" alt="">
            Sistema de Vendas
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Alternar menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-md-3">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'pedidos'} ? 'active'"
                       th:href="@{/pedidos}">Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${ativo == 'relatorio'} ? 'active'"
                       th:href="@{/pedidos/relatorio}">Relatório</a>
                </li>
                <!-- Visíveis apenas para ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${ativo == 'produtos'} ? 'active'"
                       th:href="@{/produtos}">Produtos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'"
                       th:href="@{/clientes}">Clientes</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <button th:replace="~{fragments/layout :: botaoTema('btn-outline-light btn-sm')}"></button>

                <span class="text-white small" sec:authorize="isAuthenticated()">
                    <span class="fw-semibold" sec:authentication="principal.nome">Usuário</span>
                    <span class="badge bg-light text-dark ms-1" sec:authentication="principal.role">PADRAO</span>
                </span>
                <a class="btn btn-sm btn-outline-light" sec:authorize="isAuthenticated()"
                   th:href="@{/logout}">Sair</a>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
