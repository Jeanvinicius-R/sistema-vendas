<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<div class="auth-wrap">

    <button th:replace="~{fragments/layout :: botaoTema('btn-outline-light theme-toggle-flutuante')}"></button>

    <div class="auth-card">

        <div class="text-center mb-4">
            <img class="brand-logo mb-3" th:src="@{/img/logo.svg}" alt="Sistema de Vendas">
            <h1 class="h4 fw-bold mb-1">Sistema de Vendas</h1>
            <p class="text-secondary mb-0">Entre com sua conta para continuar</p>
        </div>

        <div class="alert alert-danger py-2" th:if="${param.error}">
            E-mail ou senha inválidos.
        </div>

        <div class="alert alert-success py-2" th:if="${param.logout}">
            Você saiu do sistema com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email" class="form-control form-control-lg"
                       placeholder="voce@empresa.com" required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg"
                       placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
        </form>

    </div>
</div>

</body>
</html>
