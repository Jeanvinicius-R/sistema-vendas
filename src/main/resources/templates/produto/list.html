<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('produtos')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Produtos</h1>
            <p class="subtitle">Catálogo e controle de estoque.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/produtos/novo}">+ Novo produto</a>
    </div>

    <div class="card">

        <div th:if="${#lists.isEmpty(produtos)}" class="empty-state">
            <h2>Nenhum produto cadastrado</h2>
            <p>Cadastre o primeiro produto para começar a vender.</p>
            <a class="btn btn-primary" th:href="@{/produtos/novo}">Cadastrar produto</a>
        </div>

        <div th:unless="${#lists.isEmpty(produtos)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${produtos}">
                    <td class="fw-semibold" th:text="${produto.nome}"></td>
                    <td class="text-secondary" th:text="${produto.descricao}"></td>
                    <td class="money" th:text="${#numbers.formatCurrency(produto.preco)}"></td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${produto.quantidadeEmEstoque == 0} ? 'bg-danger-subtle text-danger-emphasis' : (${produto.quantidadeEmEstoque &lt;= 5} ? 'bg-warning-subtle text-warning-emphasis' : 'bg-success-subtle text-success-emphasis')"
                              th:text="${produto.quantidadeEmEstoque}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/produtos/edit/{id}(id=${produto.id})}">Editar</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/produtos/delete/{id}(id=${produto.id})}">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
