<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Excluir produto')}"></head>
<body>

<div th:replace="~{fragments/menu :: menu('produtos')}"></div>

<main class="container py-4">

    <div class="page-header">
        <div>
            <h1>Excluir produto</h1>
            <p class="subtitle">Esta ação não pode ser desfeita.</p>
        </div>
    </div>

    <div class="card card-danger form-card">
        <div class="card-header">
            Tem certeza que deseja excluir <strong th:text="${produto.nome}"></strong>?
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-4 text-secondary fw-semibold">Nome</dt>
                <dd class="col-sm-8" th:text="${produto.nome}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">Descrição</dt>
                <dd class="col-sm-8" th:text="${produto.descricao}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">Preço</dt>
                <dd class="col-sm-8 money" th:text="${#numbers.formatCurrency(produto.preco)}"></dd>

                <dt class="col-sm-4 text-secondary fw-semibold">Estoque</dt>
                <dd class="col-sm-8 mb-0" th:text="${produto.quantidadeEmEstoque}"></dd>
            </dl>

            <form th:action="@{/produtos/delete/{id}(id=${produto.id})}" method="post" class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
                <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
