spring.application.name=sistema-vendas

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Usuários de teste criados na primeira inicialização (somente se não existirem)
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@vendas.com}
app.seed.admin-senha=${SEED_ADMIN_SENHA:Admin@123}
app.seed.padrao-email=${SEED_PADRAO_EMAIL:padrao@vendas.com}
app.seed.padrao-senha=${SEED_PADRAO_SENHA:Padrao@123}
